# APK をビルドする。どのブランチでもテストとビルドまで行い、main では GitHub の Release に Island.apk を置く
# （端末のブラウザで https://github.com/<owner>/AndroIsland/releases/latest/download/Island.apk を開けば落とせる）。
#
# 署名: Secrets の SIGNING_KEYSTORE_BASE64 に鍵ファイルを base64 で入れておくと、毎回その鍵で署名する
# （~/.android/debug.keystore を入れれば、手元の ./deploy.sh で入れたものにも上書きできる）。
# 無ければ、その回だけの debug 鍵で署名する（前の APK には上書きできず、入れ直しになる）。
name: APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # SDK のライセンスに同意しておく（足りない platform・build-tools は AGP が自分で落とす）。
      # 既定で入れようとする古い "tools" パッケージはもう無いので、platform-tools だけにする
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: 署名の鍵を用意する
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/island.keystore"
            echo "ISLAND_KEYSTORE=$RUNNER_TEMP/island.keystore" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=secret" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 が無いので、この回だけの debug 鍵で署名します（前の APK に上書きできません）"
            echo "SIGNED_WITH=ephemeral" >> "$GITHUB_ENV"
          fi

      - name: テストとビルド
        env:
          ISLAND_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ISLAND_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ISLAND_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -PislandBuild=${{ github.run_number }} --console=plain

      - name: APK の名前をそろえる
        run: cp app/build/outputs/apk/release/app-release.apk Island.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Island-build-${{ github.run_number }}
          path: Island.apk

      - name: Release の説明を書く
        if: github.ref == 'refs/heads/main'
        run: |
          {
            echo "main の ${GITHUB_SHA::7} からビルドした APK です。"
            echo
            echo "端末のブラウザで下の **Island.apk** を開いて入れてください（初回は「提供元不明のアプリ」の許可が要ります）。"
            if [ "$SIGNED_WITH" = secret ]; then
              echo "前の APK の上に、そのまま上書きで入れられます。"
            else
              echo
              echo "⚠️ この APK はこの回だけの鍵で署名しています。前に入れた Island がある場合は、アンインストールしてから入れてください"
              echo "（アクセシビリティなどの許可はやり直しになります。Shizuku があれば設定画面の「まとめて許可」で済みます）。"
            fi
          } > release.md

      - name: Release に置く
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Island build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body_path: release.md
          files: Island.apk
          make_latest: true
